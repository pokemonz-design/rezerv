<div id="wc-tool" class="wc-wrap" lang="ru">
  <style>
    #wc-tool {
      --bg: #f4f1ec;
      --panel: #fbfaf7;
      --card: #fffdf9;
      --border: #ddd6cc;
      --border-soft: #e8e2da;
      --text: #111111;
      --muted: #6f675f;

      --accent: #b9931f;
      --accent-dark: #927416;
      --accent-soft: #f3e8bd;

      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;

      --shadow: 0 8px 24px rgba(70, 55, 24, 0.07);

      background: var(--bg);
      color: var(--text);
      border-radius: 26px;
      padding: 18px;

      max-width: 757px;
      width: 100%;
      margin: 0 auto;

      font-family: Arial, sans-serif;
    }

    #wc-tool * {
      box-sizing: border-box;
    }

    #wc-tool .hero {
      background: var(--panel);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-xl);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    #wc-tool .eyebrow {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
    }

    #wc-tool h2 {
      margin: 0 0 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17.5px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      font-weight: 700;
      max-width: 520px;
    }

    #wc-tool .sub {
      margin: 0;
      max-width: 640px;
      font-size: 14px;
      line-height: 1.55;
      color: var(--muted);
    }

    #wc-tool .controls {
      position: relative;
      margin-bottom: 14px;
      z-index: 30;
    }

    #wc-tool .dropdown {
      position: relative;
    }

    #wc-tool .dropdown summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      padding: 13px 16px;

      background: var(--card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);

      cursor: pointer;
      list-style: none;

      font-size: 14px;
      font-weight: 700;
      color: var(--text);

      transition:
        border-color 0.18s ease,
        background 0.18s ease;
    }

    #wc-tool .dropdown summary::-webkit-details-marker {
      display: none;
    }

    #wc-tool .dropdown summary::after {
      content: "▾";
      font-size: 12px;
      color: var(--muted);
      transition: transform 0.18s ease;
    }

    #wc-tool .dropdown[open] summary::after {
      transform: rotate(180deg);
    }

    #wc-tool .dropdown summary:hover {
      border-color: #cdbd82;
      background: #fffaf0;
    }

    #wc-tool .dropdown-label {
      display: block;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #wc-tool .dropdown-list {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 40;

      display: grid;
      gap: 6px;

      max-height: 460px;
      overflow-y: auto;

      padding: 8px;

      background: var(--panel);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      box-shadow: 0 12px 30px rgba(70, 55, 24, 0.14);
    }

    #wc-tool .measure {
      display: block;
      width: 100%;

      padding: 12px 13px;

      text-align: left;

      background: var(--card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);

      cursor: pointer;

      font-family: inherit;
      color: var(--text);

      transition:
        border-color 0.18s ease,
        background 0.18s ease,
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    #wc-tool .measure:hover {
      border-color: #cdbd82;
      background: #fffaf0;
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(72, 56, 24, 0.08);
    }

    #wc-tool .measure.is-active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    #wc-tool .measure-title {
      display: block;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 700;
      color: var(--text);
    }

    #wc-tool .results {
      display: grid;
      gap: 10px;
    }

    #wc-tool .result-card {
      padding: 16px;
      background: linear-gradient(180deg, #fffdf9 0%, #f8f4ed 100%);

      border: 1px solid var(--border-soft);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
    }

    #wc-tool .cell {
      padding: 14px;
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      min-width: 0;

      display: grid;
      gap: 12px;
    }

    #wc-tool .cell-section {
      min-width: 0;
    }

    #wc-tool .cell-section + .cell-section {
      padding-top: 12px;
      border-top: 1px solid var(--border-soft);
    }

    #wc-tool .cell-label {
      margin: 0 0 6px;
      font-size: 11px;
      line-height: 1.3;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent-dark);
    }

    #wc-tool .cell-text {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      overflow-wrap: break-word;
      word-break: break-word;
      hyphens: auto;
      white-space: pre-line;
    }

    #wc-tool .watch {
      margin-top: 11px;
      padding-top: 11px;
      border-top: 1px solid var(--border-soft);
      font-size: 13px;
      line-height: 1.5;
    }

    #wc-tool .watch b {
      color: var(--text);
    }

    #wc-tool .watch span {
      color: var(--muted);
    }

    #wc-tool .hidden {
      display: none;
    }

    @media (max-width: 720px) {
      #wc-tool h2 {
        font-size: 14.3px;
        max-width: 100%;
      }
    }

    @media (max-width: 560px) {
      #wc-tool {
        padding: 11px;
        border-radius: 20px;
      }

      #wc-tool .hero {
        padding: 16px;
      }

      #wc-tool h2 {
        font-size: 13px;
      }
    }

    @media print {
      #wc-tool {
        max-width: 100% !important;
        padding: 0 !important;
        background: #fff !important;
        box-shadow: none !important;
        border-radius: 0 !important;
      }

      #wc-tool .hero,
      #wc-tool .result-card {
        box-shadow: none !important;
        border: 1px solid #ccc !important;
        border-radius: 8px !important;
        background: #fff !important;
        page-break-inside: avoid;
      }

      #wc-tool .hero {
        border: none !important;
        padding: 0 0 15px 0 !important;
        margin-bottom: 15px !important;
      }

      #wc-tool .controls {
        display: none !important;
      }

      #wc-tool .cell {
        background: #fff !important;
        border: 1px solid #ddd !important;
      }
    }
  </style>

  <section class="hero">
    <div class="eyebrow">Управление оборотным капиталом</div>

    <h2>
      Чем компания заплатит за&nbsp;свободные деньги
    </h2>

    <p class="sub">
      Выберите из выпадающего списка вариант и посмотрите, какие риски при этом могут возникнуть
    </p>
  </section>

  <div class="controls">
    <details class="dropdown" id="measure-dropdown">
      <summary>
        <span id="dropdown-label" class="dropdown-label">Выберите вариант</span>
      </summary>

      <div id="measure-list" class="dropdown-list"></div>
    </details>
  </div>

  <section aria-live="polite">
    <div id="results" class="hidden"></div>
  </section>

  <script>
    (() => {
      const root = document.getElementById("wc-tool");

      if (!root || root.dataset.ready === "1") return;

      root.dataset.ready = "1";

      const measures = [
        {
          id: "cash",
          title: "Снизить неснижаемый остаток на счетах",
          effect: "Больше денег можно направить на платежи, депозит или погашение долга",
          hidden: "Один незапланированный платеж может привести к кассовому разрыву, овердрафту или потере процентов по условиям размещения",
          watch: "минимальный остаток, точность платежного календаря, внутридневные платежи",
          severity: 3
        },
        {
          id: "inventory",
          title: "Сократить запасы",
          effect: "Деньги не замораживаются в запасах",
          hidden: "Если товара не окажется в достаточном количестве, часть клиентов может уйти к конкурентам.\nПри срочных заказах дорожает логистика",
          watch: "оборачиваемость по товарным позициям, срок пополнения запаса",
          severity: 3
        },
        {
          id: "payables",
          title: "Увеличить отсрочку поставщикам",
          effect: "Компания краткосрочно улучшает денежный поток",
          hidden: "Рост закупочных цен может съесть эффект от отсрочки",
          watch: "сроки оплаты поставщикам, закупочные цены, скидки, бонусы и условия ключевых поставщиков",
          severity: 2
        },
        {
          id: "collect",
          title: "Ужесточить взыскание дебиторки",
          effect: "Компания перестает быть бесплатным кредитором для клиентов",
          hidden: "Жесткое взыскание может ускорить уход проблемного, но ценного клиента и создать будущий провал выручки",
          watch: "сроки оплаты по клиентам, маржинальность клиента, риск оттока",
          severity: 3
        },
        {
          id: "discount",
          title: "Дать скидку за раннюю оплату",
          effect: "Компания получает деньги раньше без конфликта с клиентом",
          hidden: "Если пересчитать в годовых процентах, скидка может оказаться дороже банковского кредита",
          watch: "эффективная годовая стоимость скидки, маржа и доступная ставка кредита",
          severity: 2
        },
        {
          id: "prepay",
          title: "Увеличить предоплату от клиентов",
          effect: "Деньги поступают до исполнения заказа или оказания услуги",
          hidden: "Из-за невыгодных условий клиенты могут уйти к конкурентам",
          watch: "лояльность клиентов, отток клиентов",
          severity: 3
        },
        {
          id: "capex",
          title: "Отказаться от кредитов для экономии на процентах",
          effect: "Компания экономит на процентах и формально не увеличивает долговую нагрузку",
          hidden: "Кредит все равно может понадобиться позднее, но уже срочно и на менее выгодных условиях",
          watch: "понедельный ДДС, пики платежей по проекту, запас ликвидности и доступные лимиты",
          severity: 3
        },
        {
          id: "group",
          title: "Перераспределить свободные деньги от одного участника группы другому",
          effect: "Группа закрывает дефицит без внешнего финансирования",
          hidden: "Компании-кредитору может понадобиться банковский кредит. Финансовую нагрузку просто переносят между компаниями",
          watch: "денежный поток каждого участника группы, стоимость внутригруппового финансирования",
          severity: 3
        }
      ];

      const dropdown = root.querySelector("#measure-dropdown");
      const dropdownLabel = root.querySelector("#dropdown-label");
      const list = root.querySelector("#measure-list");
      const results = root.querySelector("#results");

      let selectedId = null;

      function escapeHtml(value) {
        return String(value).replace(
          /[&<>"]/g,
          character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;"
          })[character]
        );
      }

      function renderList() {
        let html = "";

        measures.forEach(measure => {
          const active = measure.id === selectedId ? " is-active" : "";

          html += `
            <button
              type="button"
              class="measure${active}"
              data-id="${measure.id}"
            >
              <span class="measure-title">
                ${escapeHtml(measure.title)}
              </span>
            </button>
          `;
        });

        list.innerHTML = html;
      }

      function updateLabel() {
        if (!selectedId) {
          dropdownLabel.textContent = "Выберите вариант";
          return;
        }

        const measure = measures.find(item => item.id === selectedId);

        dropdownLabel.textContent = measure
          ? measure.title
          : "Выберите вариант";
      }

      function renderResults() {
        if (!selectedId) {
          results.classList.add("hidden");
          results.innerHTML = "";
          return;
        }

        const measure = measures.find(item => item.id === selectedId);

        if (!measure) return;

        results.classList.remove("hidden");

        results.innerHTML = `
          <article class="result-card">
            <div class="cell">
              <div class="cell-section">
                <p class="cell-label">Плюсы</p>
                <p class="cell-text">${escapeHtml(measure.effect)}</p>
              </div>

              <div class="cell-section">
                <p class="cell-label">Риски</p>
                <p class="cell-text">${escapeHtml(measure.hidden)}</p>
              </div>
            </div>

            <div class="watch">
              <b>Что проверить:</b>
              <span>${escapeHtml(measure.watch)}</span>
            </div>
          </article>
        `;
      }

      function render() {
        renderList();
        updateLabel();
        renderResults();
      }

      list.addEventListener("click", event => {
        const button = event.target.closest(".measure");

        if (!button) return;

        const id = button.dataset.id || "";

        if (id && id === selectedId) {
          selectedId = null;
        } else {
          selectedId = id;
        }

        dropdown.removeAttribute("open");

        render();
      });

      document.addEventListener("click", event => {
        if (
          dropdown &&
          dropdown.open &&
          !dropdown.contains(event.target)
        ) {
          dropdown.removeAttribute("open");
        }
      });

      render();
    })();
  </script>
</div>
